name: Build Essentials Plugin

on:
  push:
    branches:
      - '**'

jobs:
  getVersion:
    uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-getversion.yml@main
    secrets: inherit

  build-4Series:
    uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-4Series-builds.yml@main 
    # uses: PepperDash/workflow-templates/.github/workflows/essentialsplugins-4Series-builds.yml@nuget-publish
    secrets: inherit
    needs: getVersion
    if: needs.getVersion.outputs.newVersion == 'true'
    with:
      newVersion: ${{ needs.getVersion.outputs.newVersion }}
      version: ${{ needs.getVersion.outputs.version }}
      tag: ${{ needs.getVersion.outputs.tag }}
      channel: ${{ needs.getVersion.outputs.channel }}
      bypassPackageCheck: true

  metadata:
    needs: [getVersion, build-4Series]
    if: needs.getVersion.outputs.newVersion == 'true'
    uses: PepperDash/workflow-templates/.github/workflows/pepperdash-metadata.yml@main
    permissions:
      contents: write   # attach pepperdash-metadata.json to the release
      id-token: write   # GitHub OIDC tokens for UDM and the AI agent
    with:
      tag: ${{ needs.getVersion.outputs.tag }}
